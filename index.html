<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samsung TV Launcher</title>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.clock{
    font-size:120px;
    font-weight:bold;
    margin-bottom:50px;
}

.apps{
    display:flex;
    gap:20px;
}

.app{
    width:200px;
    height:120px;
    background:#1e293b;
    border-radius:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:26px;
}

.selected{
    border:4px solid #38bdf8;
}
</style>

</head>
<body>

<div id="clock" class="clock">00:00</div>

<div class="apps">
<div class="app selected">YouTube</div>
<div class="app">Netflix</div>
<div class="app">Spotify</div>
<div class="app">Tidal</div>
<div class="app">CANAL+</div>
</div>

<script>
function updateClock(){
    const now = new Date();

    document.getElementById("clock").innerText =
    now.toLocaleTimeString(
       "pl-PL",
       {
          hour:"2-digit",
          minute:"2-digit"
       }
    );
}

updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>

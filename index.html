<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samsung TV Premium Launcher</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
        radial-gradient(circle at top right,#2563eb 0%,transparent 30%),
        radial-gradient(circle at bottom left,#7c3aed 0%,transparent 30%),
        #0f172a;

    color:white;
    font-family:'Segoe UI',Arial,sans-serif;

    height:100vh;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.clock{
    font-size:150px;
    font-weight:700;
    line-height:1;
    margin-bottom:10px;
}

.date{
    font-size:28px;
    color:#cbd5e1;
    margin-bottom:60px;
}

.apps{
    display:flex;
    gap:25px;
}

.app{
    width:220px;
    height:180px;

    border-radius:24px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    transition:all .25s ease;
}

.logo{
    width:72px;
    height:72px;
    object-fit:contain;
    margin-bottom:12px;
}

.selected{
    border:4px solid #38bdf8;
    transform:scale(1.08);
    box-shadow:0 0 30px rgba(56,189,248,.5);
}

.app-name{
    font-size:22px;
    font-weight:600;
}

</style>
</head>

<body>

<div id="clock" class="clock">
00:00
</div>

<div id="date" class="date">
...
</div>

<div class="apps">

    <div class="app selected">
        <img class="logo" src="assets/youtube.png" alt="YouTube">
        <div class="app-name">YouTube</div>
    </div>

    <div class="app">
        <img class="logo" src="assets/netflix.png" alt="Netflix">
        <div class="app-name">Netflix</div>
    </div>

    <div class="app">
        <img class="logo" src="assets/spotify.png" alt="Spotify">
        <div class="app-name">Spotify</div>
    </div>

    <div class="app">
        <img class="logo" src="assets/tidal.png" alt="Tidal">
        <div class="app-name">Tidal</div>
    </div>

    <div class="app">
        <img class="logo" src="assets/canalplus.png" alt="CANAL+">
        <div class="app-name">CANAL+</div>
    </div>

</div>

<script>

function updateClock(){

    const now = new Date();

    document.getElementById("clock").innerText =
        now.toLocaleTimeString(
            "pl-PL",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    document.getElementById("date").innerText =
        now.toLocaleDateString(
            "pl-PL",
            {
                weekday:"long",
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        );
}

updateClock();
setInterval(updateClock,1000);

/* ===== NAWIGACJA ===== */

const apps = document.querySelectorAll(".app");

let selected = 0;

function updateSelection(){

    apps.forEach(app=>{
        app.classList.remove("selected");
    });

    apps[selected].classList.add("selected");
}

document.addEventListener("keydown",function(e){

    if(e.key==="ArrowRight"){

        selected++;

        if(selected>=apps.length){
            selected=0;
        }

        updateSelection();
    }

    if(e.key==="ArrowLeft"){

        selected--;

        if(selected<0){
            selected=apps.length-1;
        }

        updateSelection();
    }

    if(e.key==="Enter"){

        const appName =
            apps[selected]
            .querySelector(".app-name")
            .innerText;

        alert("Wybrano: " + appName);
    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samsung TV Premium Launcher</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
        radial-gradient(circle at top right,#2563eb 0%,transparent 30%),
        radial-gradient(circle at bottom left,#7c3aed 0%,transparent 30%),
        #0f172a;

    color:white;
    font-family:Segoe UI,Arial,sans-serif;
    height:100vh;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.clock{
    font-size:150px;
    font-weight:700;
    margin-bottom:10px;
}

.date{
    font-size:28px;
    color:#cbd5e1;
    margin-bottom:60px;
}

.apps{
    display:flex;
    gap:25px;
}

.app{
    width:220px;
    height:160px;

    border-radius:24px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(10px);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    transition:.2s;
}

.icon{
    font-size:56px;
    margin-bottom:12px;
}

.selected{
    border:4px solid #38bdf8;
    transform:scale(1.08);
    box-shadow:0 0 30px rgba(56,189,248,.5);
}
</style>

</head>

<body>

<div id="clock" class="clock">
00:00
</div>

<div id="date" class="date">
...
</div>

<div class="apps">

<div class="app selected">
<div class="icon">▶️</div>
<div>YouTube</div>
</div>

<div class="app">
<div class="icon">🎬</div>
<div>Netflix</div>
</div>

<div class="app">
<div class="icon">🎵</div>
<div>Spotify</div>
</div>

<div class="app">
<div class="icon">🔊</div>
<div>Tidal</div>
</div>

<div class="app">
<div class="icon">📺</div>
<div>CANAL+</div>
</div>

</div>

<script>

function updateClock(){

    const now = new Date();

    document.getElementById('clock').innerText =
        now.toLocaleTimeString(
        'pl-PL',
        {
            hour:'2-digit',
            minute:'2-digit'
        });

    document.getElementById('date').innerText =
        now.toLocaleDateString(
        'pl-PL',
        {
            weekday:'long',
            day:'numeric',
            month:'long',
            year:'numeric'
        });
}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
